name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep the compiler image stable. `macos-latest` can change Xcode versions
    # without notice and invalidates all incremental build output.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate official prayer calendar
        run: python3 tools/validate-prayer-calendar.py

      - name: Show Xcode version
        run: |
          set -euxo pipefail
          xcodebuild -version
          pwd
          echo "Repository files:"
          find . -maxdepth 3 -print | sort

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          brew install xcodegen ldid
          rm -rf TelShevaAzan.xcodeproj
          xcodegen generate

      - name: Restore Xcode build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-xcode-16-derived-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-16-derived-

      - name: Build app without App Store signing
        run: |
          set -euxo pipefail
          xcodebuild -list -project TelShevaAzan.xcodeproj
          xcodebuild \
            -project TelShevaAzan.xcodeproj \
            -scheme TelShevaAzan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -jobs 3 \
            -quiet \
            build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build watch app without App Store signing
        run: |
          set -euxo pipefail
          xcodebuild \
            -project TelShevaAzan.xcodeproj \
            -scheme TelShevaAzanWatch \
            -configuration Release \
            -sdk watchos \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath build \
            -jobs 3 \
            -quiet \
            build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP_PATH="$(find build/Build/Products -path '*Release-iphoneos/*.app' -print -quit)"
          APPEX_PATHS=()
          while IFS= read -r APPEX_PATH; do
            [ -n "$APPEX_PATH" ] && APPEX_PATHS+=("$APPEX_PATH")
          done < <(find build/Build/Products -path '*Release-iphoneos/*.appex' ! -path '*/PlugIns/*.appex' -print | sort)
          WATCH_APP_PATH="$(find build/Build/Products -path '*Release-watchos/*.app' -name 'TelShevaAzanWatch.app' -print -quit)"
          WATCH_APPEX_PATHS=()
          while IFS= read -r WATCH_APPEX_PATH; do
            [ -n "$WATCH_APPEX_PATH" ] && WATCH_APPEX_PATHS+=("$WATCH_APPEX_PATH")
          done < <(find build/Build/Products -path '*Release-watchos/*.appex' ! -path '*/PlugIns/*.appex' -print | sort)
          if [ -z "$APP_PATH" ]; then
            echo "Built .app was not found"
            exit 1
          fi
          if [ -z "$WATCH_APP_PATH" ]; then
            echo "Built watch .app was not found"
            find build/Build/Products -maxdepth 6 -print
            exit 1
          fi
          mkdir -p "$APP_PATH/PlugIns"
          EMBEDDED_APPEX_COUNT="$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${#APPEX_PATHS[@]}" -gt 0 ]; then
            rm -rf "$APP_PATH/PlugIns/"*.appex
            for APPEX_PATH in "${APPEX_PATHS[@]}"; do
              echo "Embedding iOS widget extension: $APPEX_PATH"
              cp -R "$APPEX_PATH" "$APP_PATH/PlugIns/"
            done
          elif [ "$EMBEDDED_APPEX_COUNT" -gt 0 ]; then
            echo "Widget extensions are already embedded in the app bundle"
          else
            echo "Built widget .appex was not found"
            find build/Build/Products -maxdepth 6 -print
            exit 1
          fi

          mkdir -p "$APP_PATH/Watch"
          rm -rf "$APP_PATH/Watch/"*.app
          cp -R "$WATCH_APP_PATH" "$APP_PATH/Watch/"
          WATCH_APP_IN_APP="$APP_PATH/Watch/$(basename "$WATCH_APP_PATH")"
          mkdir -p "$WATCH_APP_IN_APP/PlugIns"
          EMBEDDED_WATCH_APPEX_COUNT="$(find "$WATCH_APP_IN_APP/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${#WATCH_APPEX_PATHS[@]}" -gt 0 ] && [ "$EMBEDDED_WATCH_APPEX_COUNT" -eq 0 ]; then
            for WATCH_APPEX_PATH in "${WATCH_APPEX_PATHS[@]}"; do
              echo "Embedding watch widget extension: $WATCH_APPEX_PATH"
              cp -R "$WATCH_APPEX_PATH" "$WATCH_APP_IN_APP/PlugIns/"
            done
          fi
          WATCH_PLUGIN_PATHS=()
          while IFS= read -r WATCH_PLUGIN_PATH; do
            [ -n "$WATCH_PLUGIN_PATH" ] && WATCH_PLUGIN_PATHS+=("$WATCH_PLUGIN_PATH")
          done < <(find "$WATCH_APP_IN_APP/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null | sort)
          if [ "${#WATCH_PLUGIN_PATHS[@]}" -eq 0 ]; then
            echo "Watch Widget extension was not packaged into the watch app"
            find "$WATCH_APP_IN_APP" -maxdepth 5 -print
            exit 1
          fi
          WATCH_PLUGIN_PATH="${WATCH_PLUGIN_PATHS[0]}"

          PLUGIN_PATHS=()
          while IFS= read -r PLUGIN_PATH; do
            [ -n "$PLUGIN_PATH" ] && PLUGIN_PATHS+=("$PLUGIN_PATH")
          done < <(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' -print | sort)
          if [ "${#PLUGIN_PATHS[@]}" -eq 0 ]; then
            echo "Widget extension was not packaged into PlugIns"
            find "$APP_PATH" -maxdepth 5 -print
            exit 1
          fi
          if [ "${#PLUGIN_PATHS[@]}" -ne 1 ]; then
            echo "Expected exactly one iOS widget extension, found ${#PLUGIN_PATHS[@]}"
            find "$APP_PATH/PlugIns" -maxdepth 2 -print
            exit 1
          fi
          PLUGIN_PATH="${PLUGIN_PATHS[0]}"

          echo "Force-copy the official prayer calendar into every runtime bundle:"
          CALENDAR_RESOURCE="TelShevaAzan/Resources/PrayerCalendar/prayer-calendar-v1.json"
          cp -f "$CALENDAR_RESOURCE" "$APP_PATH/prayer-calendar-v1.json"
          for IOS_PLUGIN_PATH in "${PLUGIN_PATHS[@]}"; do
            cp -f "$CALENDAR_RESOURCE" "$IOS_PLUGIN_PATH/prayer-calendar-v1.json"
            cp -f "TelShevaAzan/Resources/Nabawi/nabawi-day.jpg" "$IOS_PLUGIN_PATH/nabawi-day.jpg"
            cp -f "TelShevaAzan/Resources/Nabawi/nabawi-night.jpg" "$IOS_PLUGIN_PATH/nabawi-night.jpg"
          done
          cp -f "$CALENDAR_RESOURCE" "$WATCH_APP_IN_APP/prayer-calendar-v1.json"
          cp -f "$CALENDAR_RESOURCE" "$WATCH_PLUGIN_PATH/prayer-calendar-v1.json"

          test -f "$APP_PATH/prayer-calendar-v1.json"
          test -f "$PLUGIN_PATH/prayer-calendar-v1.json"
          test -f "$PLUGIN_PATH/nabawi-day.jpg"
          test -f "$PLUGIN_PATH/nabawi-night.jpg"
          test -f "$WATCH_APP_IN_APP/prayer-calendar-v1.json"
          test -f "$WATCH_PLUGIN_PATH/prayer-calendar-v1.json"

          echo "Force-copy icon PNGs into the app bundle for TrollStore icon cache:"
          for icon in Icon-20@2x.png Icon-20@3x.png Icon-29@2x.png Icon-29@3x.png Icon-40@2x.png Icon-40@3x.png Icon-60@2x.png Icon-60@3x.png; do
            cp -f "TelShevaAzan/$icon" "$APP_PATH/$icon"
          done

          echo "Force-copy bundled Arabic font into the app bundle:"
          cp -f "TelShevaAzan/Fonts/UthmanicHafs1Ver18.ttf" "$APP_PATH/UthmanicHafs1Ver18.ttf"

          echo "Force-copy bundled sounds into the app bundle:"
          for sound in TelShevaAzan/Sounds/*; do
            [ -f "$sound" ] || continue
            cp -f "$sound" "$APP_PATH/$(basename "$sound")"
          done

          echo "Force-copy Nabawi background images into the app bundle:"
          cp -f "TelShevaAzan/Resources/Nabawi/nabawi-day.jpg" "$APP_PATH/nabawi-day.jpg"
          cp -f "TelShevaAzan/Resources/Nabawi/nabawi-night.jpg" "$APP_PATH/nabawi-night.jpg"

          echo "Force app icon keys into the built Info.plist:"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string Icon-20" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:1 string Icon-29" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:2 string Icon-40" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:3 string Icon-60" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$APP_PATH/Info.plist"

          echo "Force app font registration into the built Info.plist:"
          /usr/libexec/PlistBuddy -c "Delete :UIAppFonts" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string UthmanicHafs1Ver18.ttf" "$APP_PATH/Info.plist"

          echo "Widget extension registration:"
          for PLUGIN_PATH in "${PLUGIN_PATHS[@]}"; do
            echo "Widget bundle path: $PLUGIN_PATH"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLUGIN_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$PLUGIN_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$PLUGIN_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSPrincipalClass" "$PLUGIN_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:WKAppBundleIdentifier" "$PLUGIN_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLUGIN_PATH/Info.plist" || true
          done
          PLUGIN_PATH="${PLUGIN_PATHS[0]}"
          echo "App icon registration:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_PATH/Info.plist"
          echo "Watch app registration:"
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")"
          WATCH_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_APP_IN_APP/Info.plist")"
          WATCH_COMPANION_ID="$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP_IN_APP/Info.plist")"
          WATCH_WIDGET_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_PLUGIN_PATH/Info.plist")"
          WATCH_WIDGET_PARENT_ID="$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:WKAppBundleIdentifier" "$WATCH_PLUGIN_PATH/Info.plist")"
          echo "$WATCH_BUNDLE_ID"
          echo "$WATCH_COMPANION_ID"
          echo "$WATCH_WIDGET_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WATCH_PLUGIN_PATH/Info.plist" || true
          test "$WATCH_COMPANION_ID" = "$APP_BUNDLE_ID"
          test "$WATCH_BUNDLE_ID" = "$APP_BUNDLE_ID.watchkitapp"
          test "$WATCH_WIDGET_BUNDLE_ID" = "$WATCH_BUNDLE_ID.watchwidget"
          test "$WATCH_WIDGET_PARENT_ID" = "$WATCH_BUNDLE_ID"
          for icon in Icon-20@2x.png Icon-20@3x.png Icon-29@2x.png Icon-29@3x.png Icon-40@2x.png Icon-40@3x.png Icon-60@2x.png Icon-60@3x.png; do
            if [ ! -f "$APP_PATH/$icon" ]; then
              echo "Missing packaged icon: $APP_PATH/$icon"
              find "$APP_PATH" -maxdepth 2 -type f -name 'Icon-*.png' -print
              exit 1
            fi
          done
          if [ ! -f "$APP_PATH/adhan.caf" ]; then
            echo "Missing packaged adhan sound: $APP_PATH/adhan.caf"
            find "$APP_PATH" -maxdepth 3 -type f -name '*.caf' -print
            exit 1
          fi
          if [ ! -f "$APP_PATH/nafahat.wav" ]; then
            echo "Missing packaged Nafahat sound: $APP_PATH/nafahat.wav"
            find "$APP_PATH" -maxdepth 3 -type f \( -name '*.wav' -o -name '*.caf' -o -name '*.aiff' \) -print
            exit 1
          fi
          if [ ! -f "$APP_PATH/nabawi-day.jpg" ] || [ ! -f "$APP_PATH/nabawi-night.jpg" ]; then
            echo "Missing packaged Nabawi background images"
            find "$APP_PATH" -maxdepth 3 -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -print
            exit 1
          fi
          echo "Packaged app contents:"
          find "$APP_PATH" -maxdepth 4 -print | sort

          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")"
          WATCH_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$WATCH_APP_IN_APP/Info.plist")"
          WATCH_PLUGIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$WATCH_PLUGIN_PATH/Info.plist")"
          rm -rf "$APP_PATH/_CodeSignature" "$WATCH_APP_IN_APP/_CodeSignature" "$WATCH_PLUGIN_PATH/_CodeSignature"
          for PLUGIN_PATH in "${PLUGIN_PATHS[@]}"; do
            rm -rf "$PLUGIN_PATH/_CodeSignature"
          done
          echo "Ad-hoc signing watch bundles:"
          /usr/bin/codesign --force --sign - --entitlements "TelShevaAzanWatchWidget/TelShevaAzanWatchWidget.entitlements" "$WATCH_PLUGIN_PATH"
          /usr/bin/codesign --force --sign - --entitlements "TelShevaAzanWatch/TelShevaAzanWatch.entitlements" "$WATCH_APP_IN_APP"
          echo "Ad-hoc signing the complete iOS widget bundle:"
          for PLUGIN_PATH in "${PLUGIN_PATHS[@]}"; do
            PLUGIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLUGIN_PATH/Info.plist")"
            PLUGIN_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLUGIN_PATH/Info.plist")"
            PLUGIN_ENTITLEMENTS="$(mktemp)"
            cat > "$PLUGIN_ENTITLEMENTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>OMARASAM09.$PLUGIN_BUNDLE_ID</string>
            <key>com.apple.developer.team-identifier</key>
            <string>OMARASAM09</string>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.omaralasam.telshevaazan</string>
            </array>
            <key>get-task-allow</key>
            <true/>
            <key>keychain-access-groups</key>
            <array>
              <string>OMARASAM09.$PLUGIN_BUNDLE_ID</string>
            </array>
          </dict>
          </plist>
          EOF
            /usr/bin/codesign --force --sign - --entitlements "$PLUGIN_ENTITLEMENTS" "$PLUGIN_PATH"
            /usr/bin/codesign --verify --deep --strict "$PLUGIN_PATH"
          done
          echo "TrollStore ldid signing app:"
          ldid -S"TelShevaAzan/TelShevaAzan.entitlements" "$APP_PATH/$APP_EXECUTABLE"
          echo "Watch widget entitlements after codesign:"
          /usr/bin/codesign -d --entitlements :- "$WATCH_PLUGIN_PATH" || true
          echo "Watch app entitlements after codesign:"
          /usr/bin/codesign -d --entitlements :- "$WATCH_APP_IN_APP" || true
          echo "Widget bundle signatures:"
          for PLUGIN_PATH in "${PLUGIN_PATHS[@]}"; do
            echo "Widget bundle: $PLUGIN_PATH"
            /usr/bin/codesign -d --entitlements :- "$PLUGIN_PATH" || true
            test -f "$PLUGIN_PATH/_CodeSignature/CodeResources"
          done
          echo "App entitlements after ldid:"
          ldid -e "$APP_PATH/$APP_EXECUTABLE"
          {
            echo "App bundle:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"
            echo "Widget bundles:"
            for PLUGIN_PATH in "${PLUGIN_PATHS[@]}"; do
              PLUGIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLUGIN_PATH/Info.plist")"
              /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLUGIN_PATH/Info.plist"
              /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLUGIN_PATH/Info.plist"
              /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLUGIN_PATH/Info.plist"
              /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$PLUGIN_PATH/Info.plist"
              /usr/libexec/PlistBuddy -c "Print :NSPrincipalClass" "$PLUGIN_PATH/Info.plist" || true
              echo "Plugin executable:"
              ls -la "$PLUGIN_PATH/$PLUGIN_EXECUTABLE"
            done
            echo "Watch app bundle:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_APP_IN_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WATCH_APP_IN_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP_IN_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP_IN_APP/Info.plist"
            echo "Watch widget bundle:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_PLUGIN_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WATCH_PLUGIN_PATH/Info.plist"
            echo "Watch executables:"
            ls -la "$WATCH_APP_IN_APP/$WATCH_EXECUTABLE"
            ls -la "$WATCH_PLUGIN_PATH/$WATCH_PLUGIN_EXECUTABLE"
          } > build-diagnostics.txt
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/TelShevaAzan.app
          /usr/bin/zip -qry TelShevaAzan-unsigned.ipa Payload
          cp TelShevaAzan-unsigned.ipa TelShevaAzan-unsigned.tipa
          echo "Final IPA widget and icon check:"
          /usr/bin/unzip -l TelShevaAzan-unsigned.ipa > ipa-contents.txt
          awk '/Payload\/TelShevaAzan.app\/Icon-|Payload\/TelShevaAzan.app\/PlugIns\/.*\.appex\// { print; shown++; if (shown >= 80) exit }' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/Icon-60@3x.png' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/UthmanicHafs1Ver18.ttf' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/adhan.caf' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/nafahat.wav' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/fajr-alarm-02-morning-clock.wav' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/nabawi-day.jpg' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/nabawi-night.jpg' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/prayer-calendar-v1.json' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/PlugIns/.*\.appex/' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/PlugIns/TelShevaAzanWidgetExtension.appex/TelShevaAzanWidgetExtension' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/PlugIns/TelShevaAzanWidgetExtension.appex/prayer-calendar-v1.json' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/PlugIns/TelShevaAzanWidgetExtension.appex/nabawi-day.jpg' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/PlugIns/TelShevaAzanWidgetExtension.appex/nabawi-night.jpg' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/PlugIns/TelShevaAzanWidgetExtension.appex/_CodeSignature/CodeResources' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/Watch/TelShevaAzanWatch.app/' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/Watch/TelShevaAzanWatch.app/PlugIns/.*\.appex/' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/Watch/TelShevaAzanWatch.app/prayer-calendar-v1.json' ipa-contents.txt
          grep -q 'Payload/TelShevaAzan.app/Watch/TelShevaAzanWatch.app/PlugIns/TelShevaAzanWatchWidgetExtension.appex/prayer-calendar-v1.json' ipa-contents.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelShevaAzan-unsigned-ipa
          path: |
            TelShevaAzan-unsigned.ipa
            TelShevaAzan-unsigned.tipa
            build-diagnostics.txt
