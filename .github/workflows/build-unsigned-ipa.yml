name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          set -euxo pipefail
          xcodebuild -version
          pwd
          echo "Repository files:"
          find . -maxdepth 3 -print | sort

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          brew install xcodegen
          rm -rf TelShevaAzan.xcodeproj
          xcodegen generate

      - name: Build app without App Store signing
        run: |
          set -euxo pipefail
          xcodebuild -list -project TelShevaAzan.xcodeproj
          xcodebuild \
            -project TelShevaAzan.xcodeproj \
            -scheme TelShevaAzan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP_PATH="$(find build/Build/Products -path '*Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Built .app was not found"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/TelShevaAzan.app
          /usr/bin/zip -qry TelShevaAzan-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelShevaAzan-unsigned-ipa
          path: TelShevaAzan-unsigned.ipa
