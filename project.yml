name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
          - Info.plist
          - "*.entitlements"
          - "Icon-*.png"
    info:
      path: TelShevaAzan/Info.plist
    resources:
      - path: TelShevaAzan/Assets.xcassets
      - path: TelShevaAzan/Icon-20@2x.png
      - path: TelShevaAzan/Icon-20@3x.png
      - path: TelShevaAzan/Icon-29@2x.png
      - path: TelShevaAzan/Icon-29@3x.png
      - path: TelShevaAzan/Icon-40@2x.png
      - path: TelShevaAzan/Icon-40@3x.png
      - path: TelShevaAzan/Icon-60@2x.png
      - path: TelShevaAzan/Icon-60@3x.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 13
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWidgetExtension
        embed: true
  TelShevaAzanWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.widget
        PRODUCT_NAME: TelShevaAzanWidgetExtension
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 13
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
        TelShevaAzanWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
