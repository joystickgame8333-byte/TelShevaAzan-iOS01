name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
          - Fonts
          - Info.plist
          - "*.entitlements"
          - "Icon-*.png"
    info:
      path: TelShevaAzan/Info.plist
      properties:
        CFBundleDisplayName: أذان تل السبع
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.6.23"
        CFBundleVersion: "114"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-20
              - Icon-29
              - Icon-40
              - Icon-60
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - AmiriQuran-Regular.ttf
        NSLocationWhenInUseUsageDescription: يستخدم التطبيق الموقع محليًا فقط لتحسين دقة القبلة والشمال الحقيقي.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    resources:
      - path: TelShevaAzan/Assets.xcassets
      - path: TelShevaAzan/Icon-20@2x.png
      - path: TelShevaAzan/Icon-20@3x.png
      - path: TelShevaAzan/Icon-29@2x.png
      - path: TelShevaAzan/Icon-29@3x.png
      - path: TelShevaAzan/Icon-40@2x.png
      - path: TelShevaAzan/Icon-40@3x.png
      - path: TelShevaAzan/Icon-60@2x.png
      - path: TelShevaAzan/Icon-60@3x.png
      - path: TelShevaAzan/Fonts/AmiriQuran-Regular.ttf
      - path: TelShevaAzan/Sounds/adhan.caf
      - path: TelShevaAzan/Sounds/nafahat.wav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.6.23
        CURRENT_PROJECT_VERSION: 114
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWidgetExtension
        embed: true
      - target: TelShevaAzanWidgetExtensionV3
        embed: true
  TelShevaAzanWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
      - path: TelShevaAzan/AppTheme.swift
    info:
      path: TelShevaAzanWidget/Info.plist
      properties:
        CFBundleDisplayName: TelSheva Azan Widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.6.23"
        CFBundleVersion: "114"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.nextprayerwidget2
        PRODUCT_NAME: TelShevaAzanWidgetExtension
        MARKETING_VERSION: 0.6.23
        CURRENT_PROJECT_VERSION: 114
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
  TelShevaAzanWidgetExtensionV3:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
      - path: TelShevaAzan/AppTheme.swift
    info:
      path: TelShevaAzanWidget/Info.plist
      properties:
        CFBundleDisplayName: TelSheva Azan Widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.6.23"
        CFBundleVersion: "114"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.nextprayerwidget3
        PRODUCT_NAME: TelShevaAzanWidgetExtensionV3
        MARKETING_VERSION: 0.6.23
        CURRENT_PROJECT_VERSION: 114
        OTHER_SWIFT_FLAGS: "$(inherited) -D WIDGET_V3"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
  TelShevaAzanWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: TelShevaAzanWatch
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWatch/Info.plist
      properties:
        CFBundleDisplayName: أذان تل السبع
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.6.23"
        CFBundleVersion: "114"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.omaralasam.telshevaazan.76XJH357A8
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.76XJH357A8.watchkitapp
        PRODUCT_NAME: TelShevaAzanWatch
        MARKETING_VERSION: 0.6.23
        CURRENT_PROJECT_VERSION: 114
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: 9.0
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWatchWidgetExtension
        embed: true
  TelShevaAzanWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: TelShevaAzanWatchWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: أذان تل السبع
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.6.23"
        CFBundleVersion: "114"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.76XJH357A8.watchkitapp.watchwidget
        PRODUCT_NAME: TelShevaAzanWatchWidgetExtension
        MARKETING_VERSION: 0.6.23
        CURRENT_PROJECT_VERSION: 114
        WATCHOS_DEPLOYMENT_TARGET: 9.0
        TARGETED_DEVICE_FAMILY: 4
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
        TelShevaAzanWidgetExtension: all
        TelShevaAzanWidgetExtensionV3: all
    run:
      config: Debug
    archive:
      config: Release
  TelShevaAzanWatch:
    build:
      targets:
        TelShevaAzanWatch: all
        TelShevaAzanWatchWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
