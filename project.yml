name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
          - Fonts
          - Info.plist
          - "*.entitlements"
          - "Icon-*.png"
    info:
      path: TelShevaAzan/Info.plist
      properties:
        CFBundleDisplayName: أذان تل السبع
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.4.53"
        CFBundleVersion: "79"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-20
              - Icon-29
              - Icon-40
              - Icon-60
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - AmiriQuran-Regular.ttf
        NSLocationWhenInUseUsageDescription: يستخدم التطبيق الموقع محليًا فقط لتحسين دقة القبلة والشمال الحقيقي.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    resources:
      - path: TelShevaAzan/Assets.xcassets
      - path: TelShevaAzan/Icon-20@2x.png
      - path: TelShevaAzan/Icon-20@3x.png
      - path: TelShevaAzan/Icon-29@2x.png
      - path: TelShevaAzan/Icon-29@3x.png
      - path: TelShevaAzan/Icon-40@2x.png
      - path: TelShevaAzan/Icon-40@3x.png
      - path: TelShevaAzan/Icon-60@2x.png
      - path: TelShevaAzan/Icon-60@3x.png
      - path: TelShevaAzan/Fonts/AmiriQuran-Regular.ttf
      - path: TelShevaAzan/Sounds/adhan.caf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.4.53
        CURRENT_PROJECT_VERSION: 79
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
    run:
      config: Debug
    archive:
      config: Release
