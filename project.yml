name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
    resources:
      - path: TelShevaAzan/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.2.5
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "أذان تل السبع"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWidgetExtension
        embed: true
  TelShevaAzanWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.widget
        PRODUCT_NAME: TelShevaAzanWidgetExtension
        MARKETING_VERSION: 0.2.5
        CURRENT_PROJECT_VERSION: 11
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
        TelShevaAzanWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
