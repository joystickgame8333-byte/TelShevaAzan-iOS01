name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
          - Fonts
          - Info.plist
          - "*.entitlements"
          - "Icon-*.png"
    info:
      path: TelShevaAzan/Info.plist
      properties:
        CFBundleDisplayName: صلاتي
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.6.58"
        CFBundleVersion: "149"
        CFBundleURLTypes:
          - CFBundleURLName: com.omaralasam.telshevaazan
            CFBundleURLSchemes:
              - telshevaazan
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-20
              - Icon-29
              - Icon-40
              - Icon-60
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.omaralasam.telshevaazan.prayer-live-activity
        NSSupportsLiveActivities: true
        UIAppFonts:
          - AmiriQuran-Regular.ttf
        NSLocationWhenInUseUsageDescription: يستخدم التطبيق الموقع محليًا فقط لتحسين دقة القبلة والشمال الحقيقي.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    resources:
      - path: TelShevaAzan/Assets.xcassets
      - path: TelShevaAzan/Icon-20@2x.png
      - path: TelShevaAzan/Icon-20@3x.png
      - path: TelShevaAzan/Icon-29@2x.png
      - path: TelShevaAzan/Icon-29@3x.png
      - path: TelShevaAzan/Icon-40@2x.png
      - path: TelShevaAzan/Icon-40@3x.png
      - path: TelShevaAzan/Icon-60@2x.png
      - path: TelShevaAzan/Icon-60@3x.png
      - path: TelShevaAzan/Fonts/AmiriQuran-Regular.ttf
      - path: TelShevaAzan/Sounds/adhan.caf
      - path: TelShevaAzan/Sounds/adhan-mohamed-jazi.caf
      - path: TelShevaAzan/Sounds/nafahat.wav
      - path: TelShevaAzan/Sounds/notification-soft-01.wav
      - path: TelShevaAzan/Sounds/notification-soft-02.wav
      - path: TelShevaAzan/Sounds/notification-soft-03.wav
      - path: TelShevaAzan/Sounds/notification-soft-04.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-dawn-rise.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-strong-pulse.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-urgent-wake.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-golden-chime.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-deep-alarm.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-01-classic-alarm.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-02-morning-clock.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-03-clock-beep.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-04-digital-buzzer.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-05-vintage-warning.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-06-alert.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-07-emergency-alert.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-08-warning-buzzer.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-09-facility-alarm.wav
      - path: TelShevaAzan/Sounds/fajr-alarm-10-hall-alert.wav
      - path: TelShevaAzan/Resources/Nabawi/nabawi-day.jpg
      - path: TelShevaAzan/Resources/Nabawi/nabawi-night.jpg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.6.58
        CURRENT_PROJECT_VERSION: 149
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWidgetExtension
        embed: true
  TelShevaAzanWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
      - path: TelShevaAzan/AppTheme.swift
      - path: TelShevaAzan/PrayerLiveActivity.swift
    resources:
      - path: TelShevaAzan/Resources/Nabawi/nabawi-day.jpg
      - path: TelShevaAzan/Resources/Nabawi/nabawi-night.jpg
    info:
      path: TelShevaAzanWidget/Info.plist
      properties:
        CFBundleDisplayName: Salati Widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.6.58"
        CFBundleVersion: "149"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.nextprayerwidget2
        PRODUCT_NAME: TelShevaAzanWidgetExtension
        MARKETING_VERSION: 0.6.58
        CURRENT_PROJECT_VERSION: 149
        OTHER_SWIFT_FLAGS: "$(inherited) -D WIDGET_V3"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
  TelShevaAzanWidgetExtensionV3:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
      - path: TelShevaAzan/AppTheme.swift
      - path: TelShevaAzan/PrayerLiveActivity.swift
    resources:
      - path: TelShevaAzan/Resources/Nabawi/nabawi-day.jpg
      - path: TelShevaAzan/Resources/Nabawi/nabawi-night.jpg
    info:
      path: TelShevaAzanWidget/Info.plist
      properties:
        CFBundleDisplayName: Salati Widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.6.58"
        CFBundleVersion: "149"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.nextprayerwidget3
        PRODUCT_NAME: TelShevaAzanWidgetExtensionV3
        MARKETING_VERSION: 0.6.58
        CURRENT_PROJECT_VERSION: 149
        OTHER_SWIFT_FLAGS: "$(inherited) -D WIDGET_V3"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
  TelShevaAzanWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: TelShevaAzanWatch
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWatch/Info.plist
      properties:
        CFBundleDisplayName: صلاتي
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.6.58"
        CFBundleVersion: "149"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.omaralasam.telshevaazan.76XJH357A8
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.76XJH357A8.watchkitapp
        PRODUCT_NAME: TelShevaAzanWatch
        MARKETING_VERSION: 0.6.58
        CURRENT_PROJECT_VERSION: 149
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: 9.0
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWatchWidgetExtension
        embed: true
  TelShevaAzanWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: TelShevaAzanWatchWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: صلاتي
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.6.58"
        CFBundleVersion: "149"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.76XJH357A8.watchkitapp.watchwidget
        PRODUCT_NAME: TelShevaAzanWatchWidgetExtension
        MARKETING_VERSION: 0.6.58
        CURRENT_PROJECT_VERSION: 149
        WATCHOS_DEPLOYMENT_TARGET: 9.0
        TARGETED_DEVICE_FAMILY: 4
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
        TelShevaAzanWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
  TelShevaAzanWatch:
    build:
      targets:
        TelShevaAzanWatch: all
        TelShevaAzanWatchWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
