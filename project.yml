name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
          - Info.plist
          - "*.entitlements"
          - "Icon-*.png"
    info:
      path: TelShevaAzan/Info.plist
      properties:
        CFBundleDisplayName: أذان تل السبع
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.3.2"
        CFBundleVersion: "18"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-20
              - Icon-29
              - Icon-40
              - Icon-60
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    resources:
      - path: TelShevaAzan/Assets.xcassets
      - path: TelShevaAzan/Icon-20@2x.png
      - path: TelShevaAzan/Icon-20@3x.png
      - path: TelShevaAzan/Icon-29@2x.png
      - path: TelShevaAzan/Icon-29@3x.png
      - path: TelShevaAzan/Icon-40@2x.png
      - path: TelShevaAzan/Icon-40@3x.png
      - path: TelShevaAzan/Icon-60@2x.png
      - path: TelShevaAzan/Icon-60@3x.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.3.2
        CURRENT_PROJECT_VERSION: 18
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: TelShevaAzanWidgetExtension
        embed: true
  TelShevaAzanWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TelShevaAzanWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: TelShevaAzan/PrayerSchedule.swift
      - path: TelShevaAzan/AppInfo.swift
    info:
      path: TelShevaAzanWidget/Info.plist
      properties:
        CFBundleDisplayName: TelSheva Azan Widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.3.2"
        CFBundleVersion: "18"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSPrincipalClass: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omaralasam.telshevaazan.nextprayerwidget
        PRODUCT_NAME: TelShevaAzanWidgetExtension
        MARKETING_VERSION: 0.3.2
        CURRENT_PROJECT_VERSION: 18
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
        TelShevaAzanWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
