name: TelShevaAzan
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ar
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TelShevaAzan:
    type: application
    platform: iOS
    sources:
      - path: TelShevaAzan
        excludes:
          - Assets.xcassets
    resources:
      - path: TelShevaAzan/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TelShevaAzan
        PRODUCT_NAME: TelShevaAzan
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "أذان تل السبع"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
schemes:
  TelShevaAzan:
    build:
      targets:
        TelShevaAzan: all
    run:
      config: Debug
    archive:
      config: Release
